дов не уходит, волосы выпадают","Перепады настроения путает с послеродовой депрессией"],help:"Послеродовый тиреоидит встречается примерно у каждой двенадцатой мамы. Скрининг помогает вовремя отличить «обычную усталость» от того, что проверяется одним анализом крови."},{id:"oleg",name:"Олег, 56",tag:"Мужчина 50+",photo:"https://images.pexels.com/photos/19973034/pexels-photo-19973034.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940",quote:"«Усталость? Так это возраст и работа. Некогда по врачам ходить».",pains:["Апатию, набор веса и сонливость считает «нормой возраста»","Боится услышать «приговор» — предпочитает не знать","К врачу идёт только тогда, когда «прижмёт»"],help:"Симптомы гипотиреоза неспецифичны, поэтому проверяются не «обследованием всего организма», а одним анализом ТТГ. Тест показывает, есть ли смысл его сдать."},{id:"alisa",name:"Алиса, 15",tag:"Подросток (с родителями)",photo:"https://images.pexels.com/photos/8419643/pexels-photo-8419643.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940",quote:"«Все говорят: переходный возраст. А вдруг мне скажут, что я притворяюсь?»",pains:["Раздражительность и тревожность сваливают на «телефон и гормоны»","Резкие скачки веса и усталость на учёбе","Сердцебиение и дрожь в руках стесняется озвучить взрослым"],help:"Тест написан простым языком и проходится вместе с родителем. Он чётко показывает, когда подростку правда нужен эндокринолог — и что сказать врачу на приёме."},{id:"galina",name:"Галина Петровна, 68",tag:"Возраст 60+",photo:"https://images.pexels.com/photos/8439765/pexels-photo-8439765.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940",quote:"«Зябкость и память — так это же просто старость. Что тут менять…»",pains:["Симптомы маскируются под «обычное старение»: холод, запоры, память","У пожилых гипертиреоз иногда проявляется только аритмией","Боится, что лечение «в её возрасте уже поздно»"],help:"Крупный шрифт и короткие вопросы без медицинского жаргона. Компенсация гипотиреоза заметно улучшает качество жизни в любом возрасте — это доказано."}],Ma=[{id:"h1",label:"Постоянная усталость, нехватка энергии",hint:"не проходит даже после выходных и полноценного сна"},{id:"h2",label:"Сонливость днём",hint:"хочется прилечь, хотя ночью вы спали достаточно"},{id:"h3",label:"Зябкость",hint:"мёрзнете, когда всем вокруг комфортно; холодные руки и стопы"},{id:"h4",label:"Прибавка веса",hint:"вес растёт без изменений в питании и активности"},{id:"h5",label:"Сухость кожи",hint:"кожа стала суше, шелушится, тускнеет"},{id:"h6",label:"Выпадение и ломкость волос",hint:"волосы редеют; могут истончаться наружные части бровей"},{id:"h7",label:"Запоры",hint:"стул реже обычного без изменений рациона"},{id:"h8",label:"Отёчность",hint:"отекают лицо и веки по утрам, кольца «жмут»"},{id:"h9",label:"Замедление мышления, забывчивость",hint:"сложно сосредоточиться, ощущение «тумана в голове»"},{id:"h10",label:"Снижение настроения, апатия",hint:"тоска, равнодушие без видимой причины"}],Ha=[{id:"t1",label:"Сердцебиение и перебои",hint:"учащённый пульс, «трепыхание» в груди даже в покое"},{id:"t2",label:"Дрожь в руках",hint:"мелкая дрожь в пальцах вытянутых рук"},{id:"t3",label:"Повышенная потливость",hint:"потеете без нагрузки и жары"},{id:"t4",label:"Потеря веса при хорошем аппетите",hint:"едите как обычно или больше — а вес уходит"},{id:"t5",label:"Раздражительность",hint:"вспыхиваете по мелочам; близкие замечают перемены"},{id:"t6",label:"Бессонница",hint:"трудно заснуть, сон поверхностный, ранние пробуждения"},{id:"t7",label:"Частый стул",hint:"стул участился без смены питания"},{id:"t8",label:"Непереносимость жары",hint:"духота стала переноситься заметно хуже, чем раньше"},{id:"t9",label:"Мышечная слабость",hint:"тяжело подниматься по лестнице, «не держат» руки и ноги"},{id:"t10",label:"Тревожность",hint:"беспричинное беспокойство, внутренняя дрожь"}],KB=[{v:0,label:"Никогда"},{v:1,label:"Иногда"},{v:2,label:"Часто"},{v:3,label:"Постоянно"}],Z0=[{id:"rf1",label:"Резкое сердцебиение с перебоями, обморок или предобморочное состояние",track:"hyper",emergency:!0},{id:"rf2",label:"Потеря более 5 кг за последний месяц без диет и особых нагрузок",track:"hyper",emergency:!1},{id:"rf3",label:"Температура выше 38 °C вместе с сильным сердцебиением и выраженной потливостью",track:"hyper",emergency:!0},{id:"rf4",label:"Выраженная заторможенность, сонливость вплоть до трудности пробуждения, спутанность мыслей на фоне постоянной зябкости",track:"hypo",emergency:!0},{id:"rf5",label:"Быстро увеличивающееся уплотнение на шее, охриплость голоса, затруднённое глотание или дыхание",track:"both",emergency:!1}],Y0=[{id:"f_family",label:"Заболевания щитовидной железы у близких родственников",hint:"мама, папа, брат или сестра лечились от гипотиреоза, тиреотоксикоза, узлов",hypo:2,hyper:2},{id:"f_postpartum",label:"Беременность или роды в последние 12 месяцев",hint:"послеродовый тиреоидит нередко проходит фазы «ускорение» и «замедление»",hypo:2,hyper:2},{id:"f_meds",label:"Длительный приём амиодарона, препаратов лития или интерферонов",hint:"эти лекарства могут менять работу железы — обсудите с назначившим врачом",hypo:2,hyper:2},{id:"f_radiation",label:"Облучение области головы или шеи в прошлом",hint:"лучевая терапия повышает вероятность гипотиреоза и узловых образований",hypo:2,hyper:1},{id:"f_autoimmune",label:"Другое аутоиммунное заболевание",hint:"диабет 1 типа, ревматоидный артрит, витилиго, целиакия и др.",hypo:2,hyper:2},{id:"f_iodine",label:"Йододефицитный регион или бесконтрольный приём йодсодержащих добавок",hint:"и недостаток, и избыток йода способны нарушать работу железы",hypo:1,hyper:1},{id:"f_smoking",label:"Курение",hint:"заметно повышает риск болезни Грейвса и её глазных осложнений",hypo:0,hyper:1}],F0={low:{title:"Низкий риск",badge:"Поводов для тревоги по ответам нет",summary:"По вашим ответам сейчас нет выраженной совокупности признаков нарушения работы щитовидной железы. Это хорошая новость — но она не отменяет внимания к себе.",recs:["Если появятся новые симптомы из списков выше — пройдите скрининг повторно","При наличии факторов риска (семейный анамнез, аутоиммунные заболевания, курение) обсудите с терапевтом контроль ТТГ раз в 1–2 года","Используйте йодированную соль в обычных количествах — этого достаточно для профилактики йододефицита большинству людей","Не начинайте приём йодсодержащих добавок «для профилактики» без консультации врача"]},medium:{title:"Средний риск",badge:"Есть повод обследоваться",summary:"Часть симптомов и/или факторов риска совпадает с возможным нарушением работы щитовидной железы. Это повод спокойно проверить гормоны — а не повод пугаться: похожие проявления бывают и при других, вполне управляемых состояниях.",recs:["Сдайте анализ крови на ТТГ в удобной лаборатории в ближайшие 2–4 недели","При отклонении ТТГ врач обычно добавляет свободный Т4, а при необходимости — свободный Т3 и антитела","Запишитесь на приём к терапевту или эндокринологу с готовым результатом анализа","2–3 недели ведите дневник симптомов: пульс утром, вес, сон — это поможет врачу"]},high:{title:"Высокий риск",badge:"Визит к врачу лучше не откладывать",summary:"Совокупность ваших ответов — значимое число характерных симптомов и/или факторов риска — требует очной оценки эндокринолога в ближайшее время. Большинство нарушений функции щитовидной железы хорошо поддаются лечению, особенно при раннем выявлении.",recs:["Запишитесь к эндокринологу (или терапевту) в ближайшие дни","Сдайте ТТГ и свободный Т4; при сниженном ТТГ врач добавит свободный Т3 и антитела к рецепторам ТТГ","Если отмечены красные флаги — следуйте рекомендации в блоке выше и не ждите планового приёма","Возьмите на приём список принимаемых лекарств и результаты прошлых обследований, если они есть"]}},JB=[{sign:"Вес",hypo:"Прибавка без изменений в питании",hyper:"Потеря веса при хорошем аппетите",spec:"Очень характерно"},{sign:"Энергия и сон",hypo:"Усталость, сонливость днём",hyper:"Возбуждение, бессонница",spec:"Мало специфично"},{sign:"Отношение к температуре",hypo:"Зябкость, холодные руки и стопы",hyper:"Жар, потливость, духота невыносима",spec:"Очень характерно"},{sign:"Сердце",hypo:"Пульс замедленный, давление «скачет» редко",hyper:"Пульс учащённый, перебои, мерцание",spec:"Очень характерно"},{sign:"Кожа и волосы",hypo:"Сухость, шелушение, волосы ломкие, редеют",hyper:"Кожа влажная и тёплая, волосы тоньше",spec:"Характерно"},{sign:"Стул",hypo:"Склонность к запорам",hyper:"Учащённый стул",spec:"Характерно"},{sign:"Настроение",hypo:"Апатия, тоска, заторможенность",hyper:"Тревога, раздражительность",spec:"Мало специфично"},{sign:"Мышцы",hypo:"Слабость, судороги, «ватные» ноги",hyper:"Слабость в плечах и бёдрах, дрожь",spec:"Характерно"},{sign:"Менструальный цикл",hypo:"Нерегулярный, нередко обильный",hyper:"Редкий и скудный",spec:"Характерно"},{sign:"Шея и глаза",hypo:"Отёчность лица, «полное» лицо",hyper:"Увеличение железы, выступание глаз",spec:"Очень характерно"}],kB=[{id:"tth",name:"ТТГ",role:"Первый и главный анализ",text:"Гормон гипофиза, который «руководит» железой и тоньше всего чувствует сбои: при гипотиреозе он растёт, при гипертиреозе — снижается. Именно с него начинается скрининг."},{id:"t4",name:"Свободный Т4",role:"Уточняет картину",text:"Основной гормон железы в активной, «свободной» форме. Определяется, если ТТГ отклонился: помогает отличить явное нарушение от лёгкой (субклинической) формы."},{id:"t3",name:"Свободный Т3",role:"При подозрении на гипертиреоз",text:"Назначается, как правило, при низком ТТГ: у части пациентов повышен именно Т3, и без него картина неполная."},{id:"at",name:"Антитела: АТ-ТПО, АТ-ТГ, АТ к рецепторам ТТГ",role:"Поиск причины",text:"Указывают на аутоиммунный процесс (тиреоидит Хашимото, болезнь Грейвса). Важно: антитела без изменения гормонов — не болезнь, а повод для наблюдения, а не для лечения."},{id:"uzi",name:"УЗИ щитовидной железы",role:"Структура, а не функция",text:"Показывает размер, узлы, признаки воспаления. По УЗИ нельзя оценить работу железы — как и по анализам нельзя увидеть узлы. Методы дополняют друг друга."}],RB=[{myth:"«Всем нужно пить йод для профилактики»",fact:"Базовая профилактика — йодированная соль. Таблетки йода нужны далеко не всем, а при болезни Грейвса и некоторых узлах дополнительный йод может навредить. Вопрос добавок решается с врачом, особенно при беременности."},{myth:"«Узел в щитовидной железе — это рак»",fact:"Узлы встречаются очень часто — у каждого третьего-четвёртого взрослого — и абсолютное большинство из них доброкачественные. Тактику определяет врач по УЗИ-признакам (классификация TI-RADS); большинству узлов нужно лишь наблюдение."},{myth:"«Гормоны опасно принимать — железа “разленится”»",fact:"Левотироксин — это точная копия собственного гормона Т4, восполняющая его дефицит, а не «химия». При правильно подобранной дозе он безопасен для сердца и костей; страх перед препаратом приводит к годам нелеченого гипотиреоза."},{myth:"«От гормонов щитовидной железы толстеют»",fact:"Лишний вес при гипотиреозе даёт сам дефицит гормона. Компенсация левотироксином обычно нормализует обмен веществ и помогает весу стабилизироваться, а не расти."},{myth:"«Гипотиреоз можно вылечить диетой и травами»",fact:"Ни одна диета не заставит железу вырабатывать гормон, если она повреждена. Питание поддерживает общее здоровье, но заместительная терапия при подтверждённом гипотиреозе — стандарт доказательной медицины."},{myth:"«Стресс разрушает щитовидную железу»",fact:"Стресс не является первопричиной заболеваний железы. Он может спровоцировать декомпенсацию у людей с уже имеющейся предрасположенностью — поэтому после тяжёлых жизненных периодов разумно проверить ТТГ."},{myth:"«Раз ТТГ в норме — железа точно здорова»",fact:"ТТГ отражает функцию, но не структуру: узлы и часть воспалений он не покажет. И наоборот — пограничный ТТГ без симптомов чаще повод для повторного анализа через 2–3 месяца, а не для немедленного лечения."},{myth:"«Щитовидная железа — женская проблема»",fact:"У женщин заболевания правда в 5–8 раз чаще, но у мужчин они тоже встречаются — и нередко выявляются позже, потому что симптомы списываются на усталость и возраст."},{myth:"«Анализ на гормоны щитовидной железы сдают только по направлению врача»",fact:"В большинстве лабораторий ТТГ можно сдать самостоятельно. Но интерпретировать результат и решать, что делать дальше, должен врач: цифра без контекста легко вводит в панику или, наоборот, в успокоенность."},{myth:"«Пучеглазие и зоб — обязательные признаки болезни»",fact:"Оба — поздние и необязательные признаки. Гипотиреоз чаще начинается без изменений внешности вообще, поэтому ориентироваться нужно на симптомы и анализы, а не на зеркало."}],NB=[{q:"Как часто нужно проверять щитовидную железу?",a:"Здоровому человеку без факторов риска рутинный ТТГ обычно не требуется. При факторах риска, после 60 лет и беременным — по согласованию с врачом, ориентировочно раз в 1–2 года. Если вы принимаете левотироксин, периодичность контроля определяет эндокринолог."},{q:"На УЗИ нашли узел — это опасно?",a:"В большинстве случаев нет: до 90–95% узлов доброкачественные. Врач оценивает узел по УЗИ-признакам (TI-RADS) и решает: наблюдать раз в год, сделать тонкоигольную биопсию или просто забыть о нём. Паниковать раньше времени не нужно."},{q:"Нужно ли принимать йод?",a:"Для большинства взрослых достаточно йодированной соли. Препараты йода показаны при планировании и во время беременности (дозу подбирает врач) и противопоказаны при ряде заболеваний. Бесконтрольный приём «йодомаринов» и БАДов с ламинарией может нарушить работу железы."},{q:"Мне назначили левотироксин. Как его правильно принимать?",a:"Обычно утром натощак, за 30–60 минут до еды, запивая водой. Кофе, препараты кальция и железа сдвигают на 4 часа — они мешают всасыванию. Дозу меняет только врач по результатам ТТГ, который при подборе дозы сдают каждые 6–8 недель."},{q:"Что такое «субклинический гипотиреоз», который нашли у мамы?",a:"Это ситуация, когда ТТГ слегка повышен, а свободный Т4 в норме. Лечить или наблюдать — решается индивидуально: учитывают возраст, уровень ТТГ, антитела, симптомы и планы на беременность. Это не «начало конца», а повод для наблюдательной тактики у врача."},{q:"Можно ли забеременеть при гипотиреозе?",a:"Да. При компенсированном гипотиреозе (нормальный ТТГ на терапии) беременность протекает благополучно. Важно спланировать ТТГ до зачатия и сразу сообщить эндокринологу о беременности — потребность в гормоне обычно растёт уже в первые недели."},{q:"Правда, что стресс «сажает» щитовидку?",a:"Сам по себе стресс болезнь не создаёт, но может стать спусковым крючком у генетически предрасположенных людей — чаще для болезни Грейвса. Если после тяжёлого периода появились дрожь, сердцебиение, потеря веса — проверьте ТТГ."},{q:"Анализы «на гормоны» дорогие. С чего начать, если ограничен бюджет?",a:"С одного ТТГ — самого чувствительного показателя функции железы. Дальнейшая панель (св. Т4, св. Т3, антитела, УЗИ) оправдана только при отклонении ТТГ или симптомах и назначается врачом. Так вы не переплатите за ненужное."}],IB=[{title:"Гипотиреоз простыми словами",desc:"Что происходит с организмом, когда железа «замедляется», и как это исправить.",tag:"База"},{title:"Послеродовый тиреоидит",desc:"Почему после родов железа может «разогнаться», а затем «замедлиться» — и что делать маме.",tag:"Для мам"},{title:"ТТГ на границе нормы",desc:"Субклинический гипотиреоз: когда наблюдать, а когда лечить.",tag:"Анализы"},{title:"Как жить на левотироксине",desc:"Приём, совместимость с кофе и витаминами, контроль дозы, отпуск и спорт.",tag:"Терапия"},{title:"Гипертиреоз и сердце",desc:"Почему тиреотоксикоз опасен для ритма и как защитить сердце до компенсации.",tag:"Риски"},{title:"Узлы: когда беспокоиться",desc:"Читаем заключение УЗИ: TI-RADS, биопсия и наблюдение без страха.",tag:"Диагностика"},{title:"Йод: сколько нужно на самом деле",desc:"Нормы по возрастам, йодированная соль и кому йод противопоказан.",tag:"Профилактика"},{title:"Щитовидная железа и беременность",desc:"Планирование, скрининг первого триместра, послеродовый контроль.",tag:"Для мам"},{title:"Щитовидка у подростков",desc:"Как отличить болезнь от «переходного возраста»: памятка для родителей.",tag:"Подростки"},{title:"Тиреоидит Хашимото",desc:"Жизнь с аутоиммунным тиреоидитом: наблюдение, лечение, образ жизни.",tag:"Аутоиммунитет"},{title:"После 60: не списывайте на возраст",desc:"Скрытое течение гипо- и гипертиреоза у пожилых и как не пропустить.",tag:"60+"},{title:"Ежегодный чек-ап",desc:"Минимальный набор обследований для взрослого человека и что в нём лишнее.",tag:"Профилактика"}],_0=["Гипотиреоз может развиваться незаметно годами","Заболевания щитовидной железы у женщин в 5–8 раз чаще, чем у мужчин","Послеродовый тиреоидит встречается примерно у каждой 12-й мамы","Один анализ ТТГ — базовый скрининг функции железы","У пожилых симптомы нередко принимают за «обычное старение»","Большинство нарушений функции железы хорошо поддаются лечению"],WB="Результат скрининга — не диагноз. Оценить состояние щитовидной железы и назначить лечение может только врач после очного осмотра и анализов.",GB="Сайт носит исключительно информационный характер и не является медицинской услугой. Материалы не заменяют консультацию врача и не могут использоваться для самодиагностики и самолечения. Результаты онлайн-скрининга отражают лишь вероятностную оценку риска по вашим ответам и не являются диагнозом. При любых симптомах обращайтесь к врачу-терапевту или эндокринологу; при острых состояниях — за неотложной помощью. Ответы в тесте обрабатываются только в вашем браузере, никуда не передаются и не сохраняются на сервере.",zB="data:image/jpeg;base64,/9j/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAcABUADASIAAhEBAxEB/8QAHQAAAgIDAQEBAAAAAAAAAAAAAQIAAwQFBgcICf/EAFAQAAEDAwMCBAQEBAQEBQEAEwEAAhEDBCEFEjFBUQYTImEHMnGBFEKRoQgjUrEVYsHRJDNy4RZDgpLwU6LxNGOyFwklJkRzwtI1VGV0g+L/xAAaAQEBAQEBAQEA
